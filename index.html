<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pilotta Counter</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#0d4733" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #0f172a; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TARGET_SCORE = 3001;
const TRICK_POINTS = 162;
const CAPOT_POINTS = 250;
const STORAGE_KEY = "pilotta-game-state";

const SUITS = [
  { id: "hearts", label: "♥", color: "text-red-500" },
  { id: "diamonds", label: "♦", color: "text-red-500" },
  { id: "clubs", label: "♣", color: "text-white" },
  { id: "spades", label: "♠", color: "text-white" },
];

// --- tiny inline icon components (no external icon library needed) ---
const IconPlus = () => <span>+</span>;
const IconTrash = () => <span>🗑</span>;
const IconTrophy = () => <span>🏆</span>;
const IconPencil = () => <span>✏️</span>;
const IconCheck = () => <span>✓</span>;
const IconX = () => <span>✕</span>;
const IconStar = () => <span>★</span>;
const IconZap = () => <span>⚡</span>;
const IconCalc = () => <span>🧮</span>;
const IconBackspace = () => <span>⌫</span>;

function PilottaCounter() {
  const [teamNames, setTeamNames] = useState(["Team A", "Team B"]);
  const [editingTeam, setEditingTeam] = useState(null);
  const [rounds, setRounds] = useState([]);
  const [adjustments, setAdjustments] = useState([]);
  const [editingScore, setEditingScore] = useState(null);
  const [scoreAdjustInput, setScoreAdjustInput] = useState("");
  const [gameHistory, setGameHistory] = useState([]);
  const [gameRecorded, setGameRecorded] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const [biddingTeam, setBiddingTeam] = useState(0);
  const [suit, setSuit] = useState("hearts");
  const [bid, setBid] = useState(80);
  const [capot, setCapot] = useState(false);
  const [girila, setGirila] = useState(false);
  const [rekontra, setRekontra] = useState(false);
  const [trickPoints, setTrickPoints] = useState("");
  const [biddingDecl, setBiddingDecl] = useState("");
  const [opponentDecl, setOpponentDecl] = useState("");
  const [error, setError] = useState("");

  // Load saved game + in-progress draft on mount
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (Array.isArray(saved.teamNames)) setTeamNames(saved.teamNames);
        if (Array.isArray(saved.rounds)) setRounds(saved.rounds);
        if (Array.isArray(saved.adjustments)) setAdjustments(saved.adjustments);
        if (Array.isArray(saved.gameHistory)) setGameHistory(saved.gameHistory);
        if (typeof saved.gameRecorded === "boolean") setGameRecorded(saved.gameRecorded);
        if (saved.draft) {
          const d = saved.draft;
          if (typeof d.biddingTeam === "number") setBiddingTeam(d.biddingTeam);
          if (typeof d.suit === "string") setSuit(d.suit);
          if (typeof d.bid === "number") setBid(d.bid);
          if (typeof d.capot === "boolean") setCapot(d.capot);
          if (typeof d.girila === "boolean") setGirila(d.girila);
          if (typeof d.rekontra === "boolean") setRekontra(d.rekontra);
          if (typeof d.trickPoints === "string") setTrickPoints(d.trickPoints);
          if (typeof d.biddingDecl === "string") setBiddingDecl(d.biddingDecl);
          if (typeof d.opponentDecl === "string") setOpponentDecl(d.opponentDecl);
        }
      }
    } catch (e) {
      // no saved game yet, or corrupted — start fresh
    }
    setLoaded(true);
  }, []);

  // Auto-save after every change, once initial load has finished —
  // includes the in-progress Add Round form so a half-typed number is never lost
  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        teamNames, rounds, adjustments, gameHistory, gameRecorded,
        draft: { biddingTeam, suit, bid, capot, girila, rekontra, trickPoints, biddingDecl, opponentDecl },
      }));
    } catch (e) {
      // storage full or unavailable — silently ignore, game still works this session
    }
  }, [teamNames, rounds, adjustments, gameHistory, gameRecorded, biddingTeam, suit, bid, capot, girila, rekontra, trickPoints, biddingDecl, opponentDecl, loaded]);

  const [calcOpen, setCalcOpen] = useState(false);
  const [calcExpr, setCalcExpr] = useState("");
  const [calcHistory, setCalcHistory] = useState([]);

  const isOperator = (ch) => ["+", "-", "×", "÷"].includes(ch);

  const calcInputDigit = (digit) => setCalcExpr((prev) => prev + String(digit));

  const calcInputDot = () => {
    const lastSegment = calcExpr.split(/[+\-×÷]/).pop();
    if (!lastSegment.includes(".")) {
      setCalcExpr((prev) => (prev === "" ? "0." : prev + "."));
    }
  };

  const calcPressOperator = (op) => {
    setCalcExpr((prev) => {
      if (prev === "") return op === "-" ? "-" : prev;
      if (isOperator(prev[prev.length - 1])) return prev.slice(0, -1) + op;
      return prev + op;
    });
  };

  const calcClear = () => setCalcExpr("");
  const calcBackspace = () => setCalcExpr((prev) => prev.slice(0, -1));

  const calcEvaluate = (expr) => {
    if (!expr || isOperator(expr[expr.length - 1])) return null;
    const sanitized = expr.replace(/×/g, "*").replace(/÷/g, "/");
    if (!/^-?[0-9.]+([+\-*/][0-9.]+)*$/.test(sanitized)) return null;
    try {
      const result = Function(`"use strict"; return (${sanitized})`)();
      return Number.isFinite(result) ? result : null;
    } catch (e) {
      return null;
    }
  };

  const calcEquals = () => {
    const result = calcEvaluate(calcExpr);
    if (result === null) return;
    setCalcHistory((prev) => [...prev.slice(-19), `${calcExpr} = ${result}`]);
    setCalcExpr(String(result));
  };

  const calcLivePreview = calcEvaluate(calcExpr);

  const totals = rounds.reduce(
    (acc, r) => {
      acc[0] += r.scoreA;
      acc[1] += r.scoreB;
      return acc;
    },
    [0, 0]
  );
  adjustments.forEach((a) => {
    totals[a.team] += a.amount;
  });

  const winnerIndex =
    totals[0] >= TARGET_SCORE || totals[1] >= TARGET_SCORE
      ? totals[0] > totals[1] ? 0 : 1
      : null;

  // Log the finished game to history exactly once, right when a winner is reached
  useEffect(() => {
    if (!loaded || gameRecorded || winnerIndex === null) return;
    setGameHistory((prev) => [...prev, {
      id: Date.now(),
      date: new Date().toISOString(),
      winnerName: teamNames[winnerIndex],
      loserName: teamNames[1 - winnerIndex],
      scoreA: totals[0],
      scoreB: totals[1],
      teamNameA: teamNames[0],
      teamNameB: teamNames[1],
    }]);
    setGameRecorded(true);
  }, [winnerIndex, gameRecorded, loaded, teamNames, totals]);

  const addRound = () => {
    const biddingTrick = capot ? TRICK_POINTS : parseInt(trickPoints, 10);
    const biddingDeclNum = parseInt(biddingDecl || "0", 10);
    const opponentDeclNum = parseInt(opponentDecl || "0", 10);

    if (!capot && (isNaN(biddingTrick) || biddingTrick < 0 || biddingTrick > TRICK_POINTS)) {
      setError(`Trick points must be between 0 and ${TRICK_POINTS}`);
      return;
    }
    if (bid < 80 || bid % 10 !== 0) {
      setError("Pontarisma must be a multiple of 10, minimum 80");
      return;
    }
    if (isNaN(biddingDeclNum) || isNaN(opponentDeclNum) || biddingDeclNum < 0 || opponentDeclNum < 0) {
      setError("Xenous must be 0 or a positive number");
      return;
    }
    setError("");

    const gamePoints = capot ? CAPOT_POINTS : biddingTrick;
    const opponentGamePoints = capot ? 0 : TRICK_POINTS - biddingTrick;
    const madeContract = gamePoints + biddingDeclNum >= bid;
    const multiplier = rekontra ? 4 : girila ? 2 : 1;

    let scoreA = 0;
    let scoreB = 0;

    if (madeContract) {
      const biddingScore = gamePoints + biddingDeclNum + bid * multiplier;
      const opponentScore = opponentGamePoints + opponentDeclNum;
      if (biddingTeam === 0) { scoreA = biddingScore; scoreB = opponentScore; }
      else { scoreB = biddingScore; scoreA = opponentScore; }
    } else {
      const biddingScore = biddingDeclNum;
      const opponentScore = (capot ? CAPOT_POINTS : TRICK_POINTS) + bid * multiplier + opponentDeclNum;
      if (biddingTeam === 0) { scoreA = biddingScore; scoreB = opponentScore; }
      else { scoreB = biddingScore; scoreA = opponentScore; }
    }

    const round = {
      id: Date.now(), biddingTeam, suit, bid, trickPoints: biddingTrick,
      biddingDecl: biddingDeclNum, opponentDecl: opponentDeclNum,
      capot, girila, rekontra, madeContract, scoreA, scoreB,
    };

    setRounds((prev) => [...prev, round]);
    setTrickPoints(""); setBiddingDecl(""); setOpponentDecl("");
    setCapot(false); setGirila(false); setRekontra(false); setBid(80);
  };

  const deleteRound = (id) => setRounds((prev) => prev.filter((r) => r.id !== id));

  const resetGame = () => {
    setRounds([]);
    setAdjustments([]);
    setGameRecorded(false);
    // storage isn't cleared here — gameHistory must survive a "New Game" reset;
    // the next auto-save overwrites the blob with empty rounds/adjustments but keeps gameHistory.
  };

  const applyScoreAdjustment = (teamIndex) => {
    const amount = parseInt(scoreAdjustInput, 10);
    if (isNaN(amount) || amount === 0) {
      setEditingScore(null);
      setScoreAdjustInput("");
      return;
    }
    setAdjustments((prev) => [...prev, { id: Date.now(), team: teamIndex, amount }]);
    setEditingScore(null);
    setScoreAdjustInput("");
  };

  const deleteAdjustment = (id) => setAdjustments((prev) => prev.filter((a) => a.id !== id));
  const deleteGameHistoryEntry = (id) => setGameHistory((prev) => prev.filter((g) => g.id !== id));

  const winTally = gameHistory.reduce((acc, g) => {
    acc[g.winnerName] = (acc[g.winnerName] || 0) + 1;
    return acc;
  }, {});

  const updateTeamName = (index, name) =>
    setTeamNames((prev) => prev.map((n, i) => (i === index ? name : n)));

  return (
    <div className="min-h-screen w-full bg-slate-900 p-4 sm:p-6 flex flex-col items-center gap-6">
      <div className="w-full max-w-2xl flex items-center justify-between">
        <h1 className="text-2xl font-bold text-white">Pilotta Counter</h1>
        <button onClick={resetGame} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm">
          New Game
        </button>
      </div>

      <div className="w-full max-w-2xl grid grid-cols-2 gap-4">
        {teamNames.map((name, i) => (
          <div key={i} className={`rounded-2xl p-4 sm:p-5 flex flex-col items-center gap-2 shadow-xl ${i === 0 ? "bg-blue-600" : "bg-rose-600"} ${winnerIndex === i ? "ring-4 ring-yellow-300" : ""}`}>
            <div className="flex items-center gap-2">
              {editingTeam === i ? (
                <>
                  <input autoFocus value={name} onChange={(e) => updateTeamName(i, e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && setEditingTeam(null)}
                    className="text-lg font-semibold bg-white/20 text-white rounded px-2 py-1 outline-none w-24 sm:w-32 text-center" />
                  <button onClick={() => setEditingTeam(null)}><IconCheck /></button>
                </>
              ) : (
                <>
                  <h2 className="text-lg font-semibold text-white">{name}</h2>
                  <button onClick={() => setEditingTeam(i)}><IconPencil /></button>
                </>
              )}
            </div>
            {editingScore === i ? (
              <div className="flex items-center gap-2">
                <input autoFocus type="number" value={scoreAdjustInput}
                  onChange={(e) => setScoreAdjustInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && applyScoreAdjustment(i)}
                  placeholder="+/- points"
                  className="text-lg font-semibold bg-white/20 text-white rounded px-2 py-1 outline-none w-24 text-center" />
                <button onClick={() => applyScoreAdjustment(i)}><IconCheck /></button>
                <button onClick={() => { setEditingScore(null); setScoreAdjustInput(""); }}><IconX /></button>
              </div>
            ) : (
              <div className="flex items-center gap-2">
                <div className="text-4xl sm:text-5xl font-bold text-white tabular-nums">{totals[i]}</div>
                <button onClick={() => setEditingScore(i)}><IconPencil /></button>
              </div>
            )}
            {winnerIndex === i && (
              <div className="flex items-center gap-1 text-yellow-200 text-sm font-semibold">
                <IconTrophy /> Winner!
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="w-full max-w-2xl text-center text-slate-400 text-sm -mt-2">
        Playing to {TARGET_SCORE} points
      </div>

      {winnerIndex === null && (
        <div className="w-full max-w-2xl bg-slate-800 rounded-2xl p-5 flex flex-col gap-4">
          <h3 className="text-white font-semibold">Add Round</h3>

          <div className="flex flex-col gap-2">
            <label className="text-slate-300 text-sm">Bidding team</label>
            <div className="flex gap-2">
              {teamNames.map((name, i) => (
                <button key={i} onClick={() => setBiddingTeam(i)}
                  className={`flex-1 min-w-0 truncate px-2 py-2 rounded-lg font-medium transition ${biddingTeam === i ? (i === 0 ? "bg-blue-600 text-white" : "bg-rose-600 text-white") : "bg-slate-700 text-slate-300"}`}>
                  {name}
                </button>
              ))}
            </div>
          </div>

          <div className="flex flex-col gap-2">
            <label className="text-slate-300 text-sm">Trump suit</label>
            <div className="flex gap-2">
              {SUITS.map((s) => (
                <button key={s.id} onClick={() => setSuit(s.id)}
                  className={`flex-1 py-2 rounded-lg text-xl font-bold transition ${suit === s.id ? "bg-slate-600" : "bg-slate-700"} ${s.color}`}>
                  {s.label}
                </button>
              ))}
            </div>
          </div>

          <div className="flex flex-col gap-2">
            <label className="text-slate-300 text-sm">Pontarisma (min 80)</label>
            <div className="flex items-center bg-slate-700 rounded-lg overflow-hidden w-fit">
              <button onClick={() => setBid((b) => Math.max(80, b - 10))} className="px-3 py-2 text-white hover:bg-slate-600">−</button>
              <span className="px-4 text-center text-white font-semibold tabular-nums">{bid}</span>
              <button onClick={() => setBid((b) => b + 10)} className="px-3 py-2 text-white hover:bg-slate-600">+</button>
            </div>
          </div>

          <label className="flex items-center gap-2 text-slate-300 text-sm cursor-pointer">
            <input type="checkbox" checked={capot} onChange={(e) => setCapot(e.target.checked)} className="w-4 h-4" />
            <IconStar /> Kapo (bidding team won all 8 tricks = {CAPOT_POINTS} points)
          </label>

          <label className="flex items-center gap-2 text-slate-300 text-sm cursor-pointer">
            <input type="checkbox" checked={girila} onChange={(e) => { setGirila(e.target.checked); if (!e.target.checked) setRekontra(false); }} className="w-4 h-4" />
            <IconZap /> Girila (opponents double — bet that {teamNames[biddingTeam]} won't make the pontarisma, x2 on the line)
          </label>

          {girila && (
            <label className="flex items-center gap-2 text-slate-300 text-sm cursor-pointer pl-6">
              <input type="checkbox" checked={rekontra} onChange={(e) => setRekontra(e.target.checked)} className="w-4 h-4" />
              <IconZap /> Tapos (bidding team doubles back — x4 on the line)
            </label>
          )}

          {!capot && (
            <div className="flex flex-col gap-2">
              <label className="text-slate-300 text-sm">Trick points won by bidder</label>
              <input type="number" min="0" max={TRICK_POINTS} value={trickPoints}
                onChange={(e) => setTrickPoints(e.target.value)} placeholder="0-162"
                className="bg-slate-700 text-white rounded-lg px-3 py-2 outline-none tabular-nums" />
            </div>
          )}

          <div className="grid grid-cols-2 gap-3 sm:gap-4">
            <div className="flex flex-col gap-2">
              <label className="text-slate-300 text-sm">{teamNames[biddingTeam]} xenous</label>
              <input type="number" min="0" value={biddingDecl} onChange={(e) => setBiddingDecl(e.target.value)}
                placeholder="0" className="bg-slate-700 text-white rounded-lg px-3 py-2 outline-none tabular-nums" />
            </div>
            <div className="flex flex-col gap-2">
              <label className="text-slate-300 text-sm">{teamNames[1 - biddingTeam]} xenous</label>
              <input type="number" min="0" value={opponentDecl} onChange={(e) => setOpponentDecl(e.target.value)}
                placeholder="0" className="bg-slate-700 text-white rounded-lg px-3 py-2 outline-none tabular-nums" />
            </div>
          </div>

          {error && <div className="text-red-400 text-sm">{error}</div>}

          <button onClick={addRound} className="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition">
            <IconPlus /> Add Round
          </button>
        </div>
      )}

      {winnerIndex !== null && (
        <div className="w-full max-w-2xl bg-slate-800 rounded-2xl p-6 text-center">
          <div className="text-yellow-300 font-bold text-xl flex items-center justify-center gap-2">
            <IconTrophy /> {teamNames[winnerIndex]} wins the game!
          </div>
          <p className="text-slate-400 text-sm mt-1">Final score: {totals[0]} - {totals[1]}</p>
        </div>
      )}

      {rounds.length > 0 && (
        <div className="w-full max-w-2xl bg-slate-800 rounded-2xl p-5">
          <h3 className="text-white font-semibold mb-3">Round History</h3>
          <div className="flex flex-col gap-2">
            {rounds.slice().reverse().map((r, idx) => {
              const roundNum = rounds.length - idx;
              const s = SUITS.find((s) => s.id === r.suit);
              return (
                <div key={r.id} className="flex flex-col gap-1 bg-slate-700/60 rounded-lg px-3 py-2">
                  <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                    <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-200">
                      <span className="text-slate-400 w-6">#{roundNum}</span>
                      <span className="font-medium">{teamNames[r.biddingTeam]}</span>
                      <span className={`text-lg ${s.color}`}>{s.label}</span>
                      <span className="text-slate-400">pontarisma {r.bid}</span>
                      {r.madeContract ? (
                        <span className="flex items-center gap-1 text-emerald-400 text-xs font-medium"><IconCheck /> Made</span>
                      ) : (
                        <span className="flex items-center gap-1 text-red-400 text-xs font-medium"><IconX /> Failed</span>
                      )}
                      {r.capot && <span className="flex items-center gap-1 text-yellow-400 text-xs font-medium"><IconStar /> Kapo</span>}
                      {r.girila && <span className="flex items-center gap-1 text-orange-400 text-xs font-medium"><IconZap /> {r.rekontra ? "Tapos x4" : "Girila x2"}</span>}
                    </div>
                    <div className="flex items-center justify-between sm:justify-end gap-3">
                      <span className="text-slate-300 text-sm tabular-nums">+{r.scoreA} / +{r.scoreB}</span>
                      <button onClick={() => deleteRound(r.id)}><IconTrash /></button>
                    </div>
                  </div>
                  {(r.biddingDecl > 0 || r.opponentDecl > 0) && (
                    <div className="text-xs text-slate-400 pl-9">
                      Xenous — {teamNames[r.biddingTeam]}: {r.biddingDecl}, {teamNames[1 - r.biddingTeam]}: {r.opponentDecl}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {adjustments.length > 0 && (
        <div className="w-full max-w-2xl bg-slate-800 rounded-2xl p-5">
          <h3 className="text-white font-semibold mb-3">Manual Adjustments</h3>
          <div className="flex flex-col gap-2">
            {adjustments.slice().reverse().map((a) => (
              <div key={a.id} className="flex items-center justify-between bg-slate-700/60 rounded-lg px-3 py-2 text-sm text-slate-200">
                <span>{teamNames[a.team]}: {a.amount > 0 ? `+${a.amount}` : a.amount}</span>
                <button onClick={() => deleteAdjustment(a.id)}><IconTrash /></button>
              </div>
            ))}
          </div>
        </div>
      )}

      {gameHistory.length > 0 && (
        <div className="w-full max-w-2xl bg-slate-800 rounded-2xl p-5">
          <h3 className="text-white font-semibold mb-1">Game History</h3>
          <div className="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-300 mb-3">
            {Object.entries(winTally).map(([name, wins]) => (
              <span key={name} className="flex items-center gap-1">
                <IconTrophy /> {name}: {wins} {wins === 1 ? "win" : "wins"}
              </span>
            ))}
          </div>
          <div className="flex flex-col gap-2">
            {gameHistory.slice().reverse().map((g) => (
              <div key={g.id} className="flex items-center justify-between bg-slate-700/60 rounded-lg px-3 py-2 text-sm text-slate-200">
                <div className="flex flex-col">
                  <span><span className="text-yellow-400 font-medium">{g.winnerName}</span> beat {g.loserName}</span>
                  <span className="text-slate-400 text-xs">{new Date(g.date).toLocaleDateString()} — {g.scoreA} - {g.scoreB}</span>
                </div>
                <button onClick={() => deleteGameHistoryEntry(g.id)}><IconTrash /></button>
              </div>
            ))}
          </div>
        </div>
      )}

      <button onClick={() => setCalcOpen(true)} className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-2xl flex items-center justify-center z-40 text-xl">
        <IconCalc />
      </button>

      {calcOpen && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center" onClick={() => setCalcOpen(false)}>
          <div className="bg-slate-800 rounded-t-2xl sm:rounded-2xl p-4 w-full sm:w-80 flex flex-col gap-3" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h3 className="text-white font-semibold">Calculator</h3>
              <button onClick={() => setCalcOpen(false)}><IconX /></button>
            </div>

            {calcHistory.length > 0 && (
              <div className="bg-slate-900/60 rounded-xl px-3 py-2 max-h-28 overflow-y-auto flex flex-col gap-1">
                {calcHistory.slice().reverse().map((entry, i) => (
                  <div key={i} className="text-slate-400 text-xs font-mono text-right">{entry}</div>
                ))}
                <button onClick={() => setCalcHistory([])} className="text-slate-500 hover:text-red-400 text-xs text-left mt-1">Clear history</button>
              </div>
            )}

            <div className="bg-slate-900 rounded-xl px-4 py-4 text-right overflow-x-auto">
              <div className="text-white text-2xl font-mono tabular-nums min-h-[2rem]">{calcExpr || "0"}</div>
              {calcLivePreview !== null && calcExpr !== "" && (
                <div className="text-slate-500 text-sm font-mono tabular-nums">= {calcLivePreview}</div>
              )}
            </div>

            <div className="grid grid-cols-4 gap-2">
              <button onClick={calcClear} className="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-semibold">C</button>
              <button onClick={calcBackspace} className="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white flex items-center justify-center"><IconBackspace /></button>
              <button onClick={() => calcPressOperator("÷")} className="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-semibold">÷</button>
              <button onClick={() => calcPressOperator("×")} className="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-semibold">×</button>

              {[7,8,9].map((n) => <button key={n} onClick={() => calcInputDigit(n)} className="py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold">{n}</button>)}
              <button onClick={() => calcPressOperator("-")} className="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-semibold">−</button>

              {[4,5,6].map((n) => <button key={n} onClick={() => calcInputDigit(n)} className="py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold">{n}</button>)}
              <button onClick={() => calcPressOperator("+")} className="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-semibold">+</button>

              {[1,2,3].map((n) => <button key={n} onClick={() => calcInputDigit(n)} className="py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold">{n}</button>)}
              <button onClick={calcEquals} className="row-span-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xl">=</button>

              <button onClick={() => calcInputDigit(0)} className="col-span-2 py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold">0</button>
              <button onClick={calcInputDot} className="py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold">.</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PilottaCounter />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      // check for a newer service worker every time the app opens
      reg.update();
    }).catch(() => {});
  });
}
</script>
</body>
</html>
